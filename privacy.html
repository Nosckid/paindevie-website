<style>

*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.62}
a{color:#B4441F}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0;background:var(--auber);color:#fff;padding:10px 16px;z-index:200}

.top{background:var(--auber);color:var(--cream);padding:16px 0}
.wrap{max-width:680px;margin:0 auto;padding:0 24px}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{height:38px;width:auto}
.top .bt{font-family:var(--serif);font-weight:600;font-size:20px}
.brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none;margin-right:auto}
.langsw{display:flex;background:rgba(250,246,239,.12);border:1px solid rgba(250,246,239,.25);border-radius:999px;padding:3px}
.langsw button{border:none;background:transparent;font-family:var(--sans);font-size:13px;font-weight:600;color:rgba(250,246,239,.75);padding:5px 11px;border-radius:999px;cursor:pointer}
.langsw button[aria-current="true"]{background:var(--cream);color:var(--auber)}
main{padding:46px 0 64px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(27px,4vw,36px);color:var(--auber);letter-spacing:-.6px;margin:0 0 6px;line-height:1.15}
.upd{color:var(--muted);font-size:14px;margin:0 0 30px}
h2{font-family:var(--serif);font-weight:600;font-size:21px;color:var(--auber);margin:30px 0 9px;line-height:1.25}
p{margin:0 0 12px}
ul{margin:0 0 12px;padding-left:22px}
li{margin:0 0 6px}
.cookiebtn{font:inherit;font-weight:600;font-size:15px;background:var(--auber);color:var(--cream);border:none;border-radius:999px;padding:11px 24px;cursor:pointer;margin:4px 0}
.cookiebtn:hover{background:var(--auber-deep)}
.back{display:inline-block;margin-top:30px;font-weight:600}
footer{background:var(--auber-deep);color:rgba(250,246,239,.75);font-size:13.5px;padding:22px 0}

var SUPPORTED=["en","fr","es","zh"];
function P(a){return a&&a.length?a.map(function(i){return"<p>"+i+"</p>";}).join(""):"";}
function UL(a){return a&&a.length?"<ul>"+a.map(function(i){return"<li>"+i+"</li>";}).join("")+"</ul>":"";}
function render(lang){
  var d=DOC[lang]||DOC.fr;
  document.documentElement.lang=lang;
  document.title=d.title+" | Pain de Vie";
  document.getElementById("p-title").textContent=d.title;
  document.getElementById("p-upd").textContent=d.updated;
  document.getElementById("p-back").textContent=d.back;
  var body="";
  d.sections.forEach(function(s){
    body+="<section><h2>"+s.h+"</h2>"+P(s.p)+UL(s.ul)+P(s.p2);
    if(s.btn)body+='<button type="button" class="cookiebtn" data-cookie-settings>'+d.cookiebtn+"</button>";
    body+="</section>";
  });
  document.getElementById("p-body").innerHTML=body;
  document.querySelectorAll(".langsw button").forEach(function(b){
    b.setAttribute("aria-current",b.dataset.lang===lang?"true":"false");
  });
  try{localStorage.setItem("pdv_lang",lang);}catch(e){}
  var cb=document.querySelector("[data-cookie-settings]");
  if(cb)cb.addEventListener("click",function(e){e.preventDefault();if(window.PDVConsent)window.PDVConsent.open();});
}
document.querySelectorAll(".langsw button").forEach(function(b){
  b.addEventListener("click",function(){render(b.dataset.lang);});
});
var start="fr";
try{var s=localStorage.getItem("pdv_lang");if(s)start=s;else{var n=(navigator.language||"fr").slice(0,2);if(SUPPORTED.indexOf(n)>-1)start=n;}}catch(e){}
if(SUPPORTED.indexOf(start)<0)start="fr";
render(start);
document.getElementById("yr").textContent=new Date().getFullYear();
</script>
