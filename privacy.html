DOC.en={
 title:"Privacy & Cookie Policy",
 updated:"Last updated: 11 August 2026",
 intro:"Pain de Vie Sarl respects your privacy. This policy explains what personal data we process, why, on what legal basis, who we share it with, and how to exercise your rights. It is written to meet the EU General Data Protection Regulation (GDPR 2016/679) and the Australian Privacy Act 1988 (Australian Privacy Principles).",
 back:"← Back to site",
 toc_h:"Contents",
 sections:[
  {h:"1. Who is responsible for your data",
   p:["The data controller is <strong>Pain de Vie Sarl</strong>, importer and distributor of frozen foods, Irédé, Cotonou, Benin.",
      "For any question about this policy, or to exercise your rights: <a href=\"mailto:paindevie2018@gmail.com\">paindevie2018@gmail.com</a>."]},
  {h:"2. Scope",
   p:["This policy covers the pain2vie.com website. We apply the GDPR to visitors in the European Economic Area and the United Kingdom, and the Australian Privacy Principles to visitors in Australia. Where both apply, we follow the higher standard."]},
  {h:"3. Data we process",
   h3a:"a) Information you give us",
   ula:["your name;","your email address;","the subject and content of your message;","anything else you choose to add (volumes, company, requirements)."],
   h3b:"b) Information collected automatically",
   pb:["Our host, Cloudflare, records technical logs needed for security and reliability: IP address, browser type, page requested, date and time. These logs are used only to prevent abuse and diagnose faults."],
   h3c:"c) Data stored on your device",
   pc:["We use no advertising cookies and no third-party trackers. See section 5."],
   h3d:"d) Sensitive data",
   pd:["We never collect sensitive data (health, political or religious views, biometric data). Please do not include such information in your messages."]},
  {h:"4. Purposes and legal bases",
   p:["We process your data only for the following purposes:"],
   table:{head:["Purpose","Data","Legal basis (GDPR)"],
    rows:[["Responding to your business enquiry","Name, email, message","Pre-contractual steps (Art. 6(1)(b)) and legitimate interests (Art. 6(1)(f))"],
          ["Site security and abuse prevention","Technical logs, IP address","Legitimate interests (Art. 6(1)(f))"],
          ["Remembering your language and consent choice","Local storage","Legitimate interests / functionality you requested"],
          ["Anonymous audience measurement (if enabled)","Aggregated statistics","Consent (Art. 6(1)(a)) — off by default"]]},
   p2:["We never use your data for automated prospecting, profiling or targeted advertising."]},
  {h:"5. Cookies and local storage (cookie policy)",
   p:["This site sets <strong>no advertising cookies</strong> and uses no third-party trackers. We use only your browser's local storage, which stays on your device and is never sent to our servers."],
   table:{head:["Name","Type","Purpose","Duration"],
    rows:[["pdv_lang","Local storage — necessary","Remember the language you chose","Until you clear it"],
          ["pdv_consent","Local storage — necessary","Remember your consent choice","12 months"],
          ["Audience measurement","Optional — consent","Anonymous visit counts. Loaded only if you accept.","Off by default"]]},
   p2:["You can accept or refuse audience measurement at any time: refusing is exactly as easy as accepting and removes no functionality. To change your choice, use the “Cookie settings” link at the bottom of any page. You can also clear local storage in your browser settings."]},
  {h:"6. Recipients and processors",
   p:["We never sell or rent your data. It is accessible only to our authorised staff and to the following providers, acting on our instructions:"],
   ul:["<strong>FormSubmit</strong> — handles form submission and delivers your message to us by email (<a href=\"https://formsubmit.co/privacy\" target=\"_blank\" rel=\"noopener\">policy</a>);",
       "<strong>Cloudflare</strong> — hosting, delivery and site security (<a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\">policy</a>);",
       "<strong>Google Fonts</strong> — supplies display fonts; your IP address is visible to Google when fonts load (<a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policy</a>);",
       "<strong>Google Workspace / Gmail</strong> — receives and stores the messages sent to us."],
   p2:["We may also disclose data where required by law or to establish or defend legal claims."]},
  {h:"7. International transfers",
   p:["Our providers may process your data outside Benin, the European Economic Area or Australia, including in the United States. Such transfers rely on appropriate safeguards, such as the European Commission's Standard Contractual Clauses. Contact us for details."]},
  {h:"8. Retention",
   ul:["Messages received through the form: kept for as long as needed to handle your request, then up to 3 years after last contact for business purposes, unless you ask for deletion;",
       "Technical security logs: short retention set by our host;",
       "Local storage: see the durations in section 5."]},
  {h:"9. Security",
   p:["The site is served exclusively over HTTPS and protected by security headers (CSP, HSTS). Access to received messages is limited to those who need it. No system is perfect, so please do not send highly confidential information through the form."]},
  {h:"10. Your rights (GDPR)",
   p:["If you are in the EEA or the UK, you have the right to:"],
   ul:["access your data;","have it corrected;","have it erased (“right to be forgotten”);","restrict processing;","data portability;","object to processing, in particular processing based on legitimate interests;","withdraw consent at any time, without affecting the lawfulness of earlier processing."],
   p2:["To exercise these rights, email <a href=\"mailto:paindevie2018@gmail.com\">paindevie2018@gmail.com</a>. We respond within one month. You also have the right to lodge a complaint with your national supervisory authority."]},
  {h:"11. Your rights (Privacy Act 1988 — Australia)",
   p:["If you are in Australia, the Australian Privacy Principles give you the right to request access to your personal information and to have it corrected. We handle such requests within a reasonable period and free of charge where practicable.",
      "If you believe we have breached the APPs, you may complain to us at <a href=\"mailto:paindevie2018@gmail.com\">paindevie2018@gmail.com</a>. We acknowledge complaints within 30 days. If you are not satisfied with our response, you may contact the Office of the Australian Information Commissioner (OAIC): <a href=\"https://www.oaic.gov.au\" target=\"_blank\" rel=\"noopener\">oaic.gov.au</a>.",
      "In the event of a data breach likely to cause serious harm, we will notify you and the relevant authority under the Notifiable Data Breaches scheme."]},
  {h:"12. Children",
   p:["This site is aimed at business customers. We do not knowingly collect data from anyone under 16. If you believe a minor has given us data, contact us and we will delete it."]},
  {h:"13. Changes",
   p:["We may update this policy. Any significant change will be shown on this page with a new update date. The date at the top of the page governs."]},
  {h:"14. Contact us",
   p:["Pain de Vie Sarl — Irédé, Cotonou, Benin<br>Email: <a href=\"mailto:paindevie2018@gmail.com\">paindevie2018@gmail.com</a><br>Phone: <a href=\"tel:+2290169296492\">+229 01 69 29 64 92</a>"]}
 ]};

var SUPPORTED=["en","fr","es","zh"];

function block(tag,items){
  if(!items||!items.length)return"";
  if(tag==="ul")return"<ul>"+items.map(function(i){return"<li>"+i+"</li>";}).join("")+"</ul>";
  return items.map(function(i){return"<p>"+i+"</p>";}).join("");
}
function tableHTML(t){
  if(!t)return"";
  return'<table><thead><tr>'+t.head.map(function(h){return"<th scope=\"col\">"+h+"</th>";}).join("")+
    "</tr></thead><tbody>"+t.rows.map(function(r){
      return"<tr>"+r.map(function(c,i){return i===0?"<th scope=\"row\">"+c+"</th>":"<td>"+c+"</td>";}).join("")+"</tr>";
    }).join("")+"</tbody></table>";
}
function render(lang){
  var d=DOC[lang]||DOC.fr;
  document.documentElement.lang=lang;
  document.title=d.title+" | Pain de Vie";
  document.getElementById("p-title").textContent=d.title;
  document.getElementById("p-upd").textContent=d.updated;
  document.getElementById("p-intro").innerHTML=d.intro;
  document.getElementById("p-back").textContent=d.back;
  document.getElementById("toc-h").textContent=d.toc_h;

  var toc="",body="";
  d.sections.forEach(function(s,i){
    var id="sec-"+(i+1);
    toc+='<li><a href="#'+id+'">'+s.h+"</a></li>";
    body+='<section><h2 id="'+id+'">'+s.h+"</h2>";
    body+=block("p",s.p);
    if(s.h3a){body+="<h3>"+s.h3a+"</h3>"+block("ul",s.ula);}
    if(s.h3b){body+="<h3>"+s.h3b+"</h3>"+block("p",s.pb);}
    if(s.h3c){body+="<h3>"+s.h3c+"</h3>"+block("p",s.pc);}
    if(s.h3d){body+="<h3>"+s.h3d+"</h3>"+block("p",s.pd);}
    body+=tableHTML(s.table);
    body+=block("ul",s.ul);
    body+=block("p",s.p2);
    body+="</section>";
  });
  document.getElementById("p-toc").innerHTML=toc;
  document.getElementById("p-body").innerHTML=body;

  document.querySelectorAll(".langsw button").forEach(function(b){
    b.setAttribute("aria-current",b.dataset.lang===lang?"true":"false");
  });
  try{localStorage.setItem("pdv_lang",lang);}catch(e){}
  if(window.PDVConsent)window.PDVConsent.setLang(lang);
}
document.querySelectorAll(".langsw button").forEach(function(b){
  b.addEventListener("click",function(){render(b.dataset.lang);});
});
var start="fr";
try{var s=localStorage.getItem("pdv_lang");if(s)start=s;else{var n=(navigator.language||"fr").slice(0,2);if(SUPPORTED.indexOf(n)>-1)start=n;}}catch(e){}
if(SUPPORTED.indexOf(start)<0)start="fr";
render(start);
document.getElementById("yr").textContent=new Date().getFullYear();
</script>
<script src="consent.js" defer></script>
</body>
</html>
